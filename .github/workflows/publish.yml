name: publish

# Publishes to PyPI when a GitHub Release is created.
# Requires either a PYPI_API_TOKEN secret, or PyPI Trusted Publishing
# (recommended) configured for this repository.

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        # If you use an API token instead of Trusted Publishing, replace the
        # step above with:
        #   with:
        #     password: ${{ secrets.PYPI_API_TOKEN }}
