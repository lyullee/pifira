name: publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build, audit, and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pifira
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tools
        run: python -m pip install --upgrade pip build twine pytest
      - name: Verify release tag and metadata versions
        run: python tools/check_release_version.py "$GITHUB_REF_NAME"
      - name: Install and test candidate
        run: |
          python -m pip install -e .
          python -m pytest -q
      - name: Build distribution archives
        run: python -m build
      - name: Check metadata and third-party-data policy
        run: |
          python -m twine check dist/*
          python tools/check_distribution.py dist/*
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
