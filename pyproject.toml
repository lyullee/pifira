[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pifira"
version = "0.2.0"
description = "Pressure-based inverse fire analysis with evidence-gated LH2 ortho-para and nozzle utilities"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ugwiyeon Lee" },
]
maintainers = [
    { name = "Ugwiyeon Lee" },
]
keywords = [
    "LPG", "liquid hydrogen", "fire safety", "heat flux",
    "pressure relief valve", "ortho-para hydrogen", "closed-vessel",
    "pressure-rise method", "BLEVE", "process safety",
    "thermal engineering", "inverse method",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "CoolProp>=6.6",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = [
    "build>=1.2",
    "matplotlib>=3.7",
    "pytest>=8.0",
    "twine>=6.0",
]

[project.urls]
Homepage = "https://github.com/lyullee/pifira"
Repository = "https://github.com/lyullee/pifira"
Issues = "https://github.com/lyullee/pifira/issues"
Changelog = "https://github.com/lyullee/pifira/blob/main/CHANGELOG.md"
"Validation sources" = "https://github.com/lyullee/pifira/blob/main/VALIDATION_SOURCES.md"
DOI = "https://doi.org/10.5281/zenodo.22162092"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
